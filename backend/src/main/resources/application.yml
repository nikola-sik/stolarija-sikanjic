# =============================================================================
# DEFAULT KONFIGURACIJA (DEV PROFIL)
#
# Za produkciju: koristi application-prod.yml ili env varijable.
# Sve sensitive vrijednosti (lozinke, secrets) moraju biti env varijable
# u produkciji — nikad ne commitati prave produkcione vrijednosti.
# =============================================================================

spring:
  application:
    name: carpentry-shop-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # PostgreSQL - lokalno preko docker-compose
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/showcase}
    username: ${DB_USERNAME:showcase}
    password: ${DB_PASSWORD:showcase_dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway upravlja schemom, JPA samo validira
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: true
    open-in-view: false  # best practice: izbjegavaj OSIV anti-pattern

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # File upload limits
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

# =============================================================================
# APP CONFIG - sve što je specifično za biznis ili infrastrukturu
# =============================================================================
app:
  business-name: ${BUSINESS_NAME:Stolarska radnja Sikanjic}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  # JWT konfiguracija
  jwt:
    # PROMIJENI U PRODUKCIJI! Generiši sa: openssl rand -base64 64
    secret: ${JWT_SECRET:dev_secret_key_minimum_64_chars_long_for_HS256_algorithm_change_in_production_please}
    # Trajanje tokena - 8 sati za admina (radni dan)
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
    issuer: ${JWT_ISSUER:business-showcase}

  # Storage - S3-compatible (MinIO lokalno, R2/B2 u produkciji)
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:gallery}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin_dev}
    # Javni URL za serviranje slika (preko CDN-a u produkciji)
    public-url-base: ${S3_PUBLIC_URL:http://localhost:9000/gallery}
    # MinIO koristi path-style, R2/S3 koriste virtual-host-style
    path-style-access: ${S3_PATH_STYLE:true}

# =============================================================================
# OPENAPI / SWAGGER
# =============================================================================
springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui
    operations-sorter: alpha

# =============================================================================
# MANAGEMENT / ACTUATOR
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# =============================================================================
# LOGGING
# =============================================================================
logging:
  level:
    root: INFO
    com.businessshowcase: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
