# Konfiguracija za testove - H2 in-memory baza
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ''
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false  # u testovima Hibernate kreira schemu

app:
  jwt:
    secret: test_secret_key_minimum_64_characters_long_for_HS256_algorithm_used_only_in_tests
    expiration-ms: 3600000
    issuer: test
  storage:
    endpoint: http://localhost:9000
    region: us-east-1
    bucket: test-bucket
    access-key: test
    secret-key: test
    public-url-base: http://localhost:9000/test-bucket
    path-style-access: true
  cors:
    allowed-origins: http://localhost:4200
